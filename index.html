<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다큐 스트럭처 스튜디오 — 3막 8장</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard-dynamic-subset.min.css">
<style>
:root{
  --bg:#101216; --bg2:#171a20; --card:#1d2129; --card2:#232834;
  --line:#2e3442; --txt:#e8eaf0; --sub:#9aa3b5; --faint:#6b7385;
  --gold:#e6b453; --gold-soft:rgba(230,180,83,.14);
  --act1:#5eb8a6; --act2:#e6b453; --act3:#e0777d;
  --ok:#6fcf97;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--txt); line-height:1.6; font-size:15px;
}
textarea,input,button{font-family:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(16,18,22,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 28px; display:flex; align-items:center; gap:18px;
}
.logo{display:flex; align-items:center; gap:10px; white-space:nowrap}
.logo .mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),#c98a2e);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#1a1409;font-size:15px;
}
.logo .name{font-weight:700;font-size:15px;letter-spacing:.2px}
.logo .name small{display:block;font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:1.5px}
.top-progress{flex:1; display:flex; align-items:center; gap:12px; min-width:0}
.pbar{flex:1; height:7px; background:var(--card2); border-radius:99px; overflow:hidden}
.pbar>div{height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg,var(--act1),var(--gold),var(--act3));
  transition:width .4s ease}
.ppct{font-size:13px; font-weight:700; color:var(--gold); min-width:74px; text-align:right}
.top-actions{display:flex; gap:8px}
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--txt);
  padding:8px 14px; border-radius:9px; font-size:13px; cursor:pointer;
  transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--gold); color:var(--gold)}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#221a08; font-weight:700}
.btn.primary:hover{filter:brightness(1.08); color:#221a08}

/* ---------- layout ---------- */
.wrap{max-width:1060px; margin:0 auto; padding:34px 28px 90px}

/* ---------- project panel ---------- */
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 28px; margin-bottom:26px;
}
.panel h2{font-size:13px; letter-spacing:2px; color:var(--gold); font-weight:700; margin-bottom:18px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:12.5px; color:var(--sub); font-weight:600}
.field .hint{font-size:11.5px; color:var(--faint); font-weight:400}
input[type=text], input[type=number], textarea{
  background:var(--bg2); border:1px solid var(--line); border-radius:9px;
  color:var(--txt); padding:10px 12px; font-size:14px; outline:none;
  transition:border .15s; width:100%;
}
input:focus, textarea:focus{border-color:var(--gold)}
textarea{resize:vertical; min-height:64px}
.title-input{font-size:20px !important; font-weight:700; padding:12px 14px !important}

/* ---------- timeline ---------- */
.timeline{margin:6px 0 2px}
.tl-bar{display:flex; height:44px; border-radius:10px; overflow:hidden; border:1px solid var(--line)}
.tl-seg{
  position:relative; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:rgba(0,0,0,.65); cursor:pointer;
  transition:filter .15s; min-width:0; overflow:hidden; white-space:nowrap;
}
.tl-seg:hover{filter:brightness(1.15)}
.tl-seg span{padding:0 4px; overflow:hidden; text-overflow:ellipsis}
.tl-seg + .tl-seg{border-left:1px solid rgba(0,0,0,.25)}
.tl-acts{display:flex; margin-top:6px; font-size:11.5px; color:var(--sub)}
.tl-acts>div{text-align:center; font-weight:600}
.tl-legend{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--sub); flex-wrap:wrap}
.tl-legend .sum{margin-left:auto; font-weight:700}
.tl-legend .sum.over{color:var(--act3)}
.tl-legend .sum.exact{color:var(--ok)}
.dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:1px}

/* ---------- act sections ---------- */
.act{margin-bottom:34px}
.act-head{
  display:flex; align-items:baseline; gap:12px; margin-bottom:14px;
  padding-left:14px; border-left:4px solid;
}
.act-head h3{font-size:19px; font-weight:800}
.act-head .desc{font-size:13px; color:var(--sub)}
.act-head .ratio{margin-left:auto; font-size:12px; color:var(--faint); white-space:nowrap}
.act[data-act="1"] .act-head{border-color:var(--act1)}
.act[data-act="2"] .act-head{border-color:var(--act2)}
.act[data-act="3"] .act-head{border-color:var(--act3)}

/* ---------- sequence cards ---------- */
.seq{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:14px; overflow:hidden; transition:border-color .2s;
}
.seq.done{border-color:rgba(111,207,151,.45)}
.seq-head{
  display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer;
  user-select:none;
}
.seq-num{
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px; color:rgba(0,0,0,.7);
}
.seq[data-act="1"] .seq-num{background:var(--act1)}
.seq[data-act="2"] .seq-num{background:var(--act2)}
.seq[data-act="3"] .seq-num{background:var(--act3)}
.seq-title-box{flex:1; min-width:0}
.seq-name{font-weight:700; font-size:15.5px}
.seq-sub{font-size:12px; color:var(--sub); margin-top:1px}
.seq-meta{display:flex; align-items:center; gap:14px; flex-shrink:0}
.seq-min{font-size:12.5px; color:var(--faint)}
.seq-min b{color:var(--gold); font-size:14px}
.chev{color:var(--faint); transition:transform .25s; font-size:12px}
.seq.open .chev{transform:rotate(180deg)}
.check{
  width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:transparent; font-size:13px; transition:.15s; flex-shrink:0;
}
.check.on{background:var(--ok); border-color:var(--ok); color:#10241a}
.seq-body{display:none; padding:4px 20px 22px; border-top:1px solid var(--line)}
.seq.open .seq-body{display:block}

.guide{
  background:var(--gold-soft); border:1px solid rgba(230,180,83,.25);
  border-radius:10px; padding:13px 16px; margin:16px 0;
}
.guide .g-label{font-size:11px; letter-spacing:1.5px; color:var(--gold); font-weight:700; margin-bottom:6px}
.guide ul{list-style:none}
.guide li{font-size:13px; color:var(--txt); padding:2.5px 0 2.5px 16px; position:relative}
.guide li::before{content:"?"; position:absolute; left:0; color:var(--gold); font-weight:800}

.seq-grid{display:grid; grid-template-columns:2fr 1fr; gap:16px}
@media(max-width:760px){
  .seq-grid,.grid2{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .wrap{padding:22px 14px 80px}
}
.src-box{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:14px}
.src-box h4{font-size:11.5px; letter-spacing:1px; color:var(--sub); font-weight:700; margin-bottom:8px}
.src-box textarea{min-height:52px; font-size:13px; border:1px solid transparent; background:var(--card)}
.src-box .field{margin-bottom:10px}
.src-box .field:last-child{margin-bottom:0}
.src-box label{font-size:11.5px !important}
.runtime-row{display:flex; align-items:center; gap:10px; margin-top:14px}
.runtime-row label{font-size:12.5px; color:var(--sub); font-weight:600}
.runtime-row input{width:80px; text-align:center}
.runtime-row .rec{font-size:12px; color:var(--faint)}

/* ---------- 촬영 콘티 ---------- */
select{
  background:var(--bg2); border:1px solid var(--line); border-radius:8px;
  color:var(--txt); padding:8px 8px; font-size:12.5px; outline:none; width:100%;
  cursor:pointer; transition:border .15s; font-family:inherit;
}
select:focus{border-color:var(--gold)}
.conti{margin-top:18px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:14px}
.conti-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.conti-top h4{font-size:11.5px; letter-spacing:1px; color:var(--sub); font-weight:700}
.conti-top h4 b{color:var(--gold)}
.btn.small{padding:5px 11px; font-size:12px; border-radius:7px}
.shot-cols{
  display:grid; grid-template-columns:30px 108px 108px 1fr 140px 62px 74px;
  gap:8px; padding:0 10px 6px; font-size:10.5px; letter-spacing:.5px;
  color:var(--faint); font-weight:700;
}
.shot-row{
  display:grid; grid-template-columns:30px 108px 108px 1fr 140px 62px 74px;
  gap:8px; align-items:center; background:var(--card);
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px;
}
.shot-row .cut-no{
  font-weight:800; font-size:13px; color:var(--gold); text-align:center;
}
.shot-row textarea{min-height:38px; font-size:12.5px; padding:7px 9px; background:var(--bg2)}
.shot-row input{font-size:12.5px; padding:7px 9px; background:var(--bg2)}
.shot-btns{display:flex; gap:3px; justify-content:flex-end}
.icon-btn{
  width:22px; height:22px; border:1px solid var(--line); background:transparent;
  color:var(--faint); border-radius:6px; cursor:pointer; font-size:10px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold)}
.icon-btn.del:hover{border-color:var(--act3); color:var(--act3)}
.conti-empty{font-size:12.5px; color:var(--faint); text-align:center; padding:10px 0 6px}
@media(max-width:900px){
  .shot-cols{display:none}
  .shot-row{grid-template-columns:1fr 1fr; }
  .shot-row .cut-no{text-align:left}
  .shot-row>*:nth-child(4){grid-column:1/-1}
}

/* footer note */
.note{font-size:12px; color:var(--faint); text-align:center; margin-top:30px; line-height:1.8}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--card2); border:1px solid var(--gold); color:var(--txt);
  padding:11px 22px; border-radius:99px; font-size:13.5px; z-index:99;
  transition:transform .3s ease; box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="mark">D</div>
    <div class="name">다큐 스트럭처 스튜디오<small>3-ACT · 8-SEQUENCE</small></div>
  </div>
  <div class="top-progress">
    <div class="pbar"><div id="pbarFill"></div></div>
    <div class="ppct" id="ppct">0% · 0/8장</div>
  </div>
  <div class="top-actions">
    <span id="saveStamp" style="font-size:11.5px;color:var(--faint);align-self:center;white-space:nowrap"></span>
    <label class="btn" for="fileInput" role="button" tabindex="0" style="display:inline-block">📂 불러오기</label>
    <button class="btn" id="btnSave">💾 JSON 저장</button>
    <button class="btn primary" id="btnExport">📄 기획안 내보내기</button>
  </div>
</div>

<div class="wrap">

  <!-- 프로젝트 개요 -->
  <div class="panel">
    <h2>PROJECT OVERVIEW</h2>
    <div class="field">
      <label>작품 제목</label>
      <input type="text" id="pTitle" class="title-input" placeholder="다큐멘터리 제목을 입력하세요">
    </div>
    <div class="grid2">
      <div class="field">
        <label>로그라인 <span class="hint">— 한 문장으로 요약한 이야기</span></label>
        <textarea id="pLogline" placeholder="누가, 무엇을, 왜 하는 이야기인가?"></textarea>
      </div>
      <div class="field">
        <label>중심 질문 / 메시지 <span class="hint">— 이 다큐가 끝까지 붙잡는 질문</span></label>
        <textarea id="pQuestion" placeholder="관객이 끝까지 궁금해할 질문은 무엇인가?"></textarea>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>총 러닝타임 (분)</label>
        <input type="number" id="pRuntime" min="1" value="60">
      </div>
      <div class="field">
        <label>주요 등장인물 / 소재</label>
        <input type="text" id="pCast" placeholder="예: 30년차 해녀 김OO, 마지막 물질을 앞둔 여름">
      </div>
    </div>
  </div>

  <!-- 타임라인 -->
  <div class="panel">
    <h2>RUNTIME TIMELINE</h2>
    <div class="timeline">
      <div class="tl-bar" id="tlBar"></div>
      <div class="tl-acts" id="tlActs"></div>
      <div class="tl-legend">
        <span><span class="dot" style="background:var(--act1)"></span>1막 · 설정 (약 25%)</span>
        <span><span class="dot" style="background:var(--act2)"></span>2막 · 대립 (약 50%)</span>
        <span><span class="dot" style="background:var(--act3)"></span>3막 · 해결 (약 25%)</span>
        <span class="sum" id="tlSum"></span>
      </div>
    </div>
  </div>

  <div id="acts"></div>

  <p class="note">
    ✅ 입력한 내용은 이 브라우저에 <b>자동 저장</b>돼요. 다음에 다시 접속해도 이어서 작업할 수 있어요.<br>
    다른 기기로 옮기거나 백업하려면 <b>💾 JSON 저장</b> → <b>📂 불러오기</b>를 사용하세요. 완성되면 <b>📄 기획안 내보내기</b>로 마크다운 문서를 받을 수 있어요.
  </p>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)">

<script>
/* ================= 데이터 정의 ================= */
const STRUCTURE = [
  {act:1, actName:"1막 · 설정", actDesc:"세계와 인물, 그리고 질문의 등장", seqs:[
    {n:1, name:"오프닝 · 세계와 인물", sub:"훅으로 관객을 붙잡고, 이 세계와 주인공의 일상을 보여준다",
     guide:["첫 3분 안에 관객을 붙잡을 '훅'은 무엇인가?","관객이 왜 이 인물(소재)을 따라가야 하는가?","사건이 벌어지기 전, 이곳의 '평범한 일상'은 어떤 모습인가?"]},
    {n:2, name:"발단 · 문제의 등장", sub:"일상을 깨는 사건이 벌어지고, 중심 질문이 던져진다 (1막 전환점)",
     guide:["평범한 일상을 깨뜨리는 사건·변화는 무엇인가?","이 다큐가 끝까지 붙잡을 중심 질문이 여기서 명확히 드러나는가?","주인공에게 무엇이 걸려 있는가? (잃을 것 / 얻을 것)"]},
  ]},
  {act:2, actName:"2막 · 대립", actDesc:"시도와 좌절, 반전과 위기의 연속", seqs:[
    {n:3, name:"첫 시도 · 새로운 국면", sub:"주인공이 문제에 대응하기 시작하고, 새로운 인물·정보가 등장한다",
     guide:["주인공은 문제에 어떻게 대응하기 시작하는가?","새로 등장하는 인물, 조력자, 정보는 무엇인가?","관객의 기대를 어떤 방향으로 끌고 가는가?"]},
    {n:4, name:"심화 · 상승", sub:"갈등이 깊어지며 중간점(미드포인트)을 향해 간다",
     guide:["갈등을 키우는 장애물·이해관계는 무엇인가?","중간점에서 드러나는 새로운 사실이나 작은 승리/패배는?","여기까지 관객이 알게 된 것과 아직 모르는 것은?"]},
    {n:5, name:"반전 · 판이 바뀌다", sub:"중간점 이후, 상황의 의미가 달라지고 압박이 커진다",
     guide:["중간점 이후 무엇이 달라졌는가? (목표, 관계, 진실)","압박과 긴장을 어떻게 시각적으로 쌓아 올릴 것인가?","기존 정보를 뒤집는 반전 요소가 있는가?"]},
    {n:6, name:"최대 위기 · 가장 어두운 순간", sub:"모든 것이 무너지는 최저점 (2막 전환점)",
     guide:["주인공이 가장 밑바닥에 닿는 순간은 언제인가?","이 순간 관객이 느껴야 할 감정은 무엇인가?","여기서 3막으로 넘어가게 만드는 결심·계기는 무엇인가?"]},
  ]},
  {act:3, actName:"3막 · 해결", actDesc:"결정적 순간, 그리고 남는 것", seqs:[
    {n:7, name:"클라이맥스 · 결정적 순간", sub:"중심 질문에 대한 답이 드러나는 정면 대결의 순간",
     guide:["중심 질문에 대한 답이 드러나는 결정적 장면은 무엇인가?","이 순간을 어떤 소스(현장, 인터뷰, 아카이브)로 보여줄 것인가?","연출 없이 '기다려서 잡아야 할' 순간이라면, 어떻게 준비할 것인가?"]},
    {n:8, name:"해결 · 에필로그", sub:"변화한 일상과 여운, 관객에게 남기는 마지막 이미지",
     guide:["사건 이후, 인물과 세계는 어떻게 달라졌는가?","관객에게 남기고 싶은 마지막 이미지·문장은 무엇인가?","중심 질문은 답을 얻었는가, 아니면 열린 채 남는가?"]},
  ]},
];
const FLAT = STRUCTURE.flatMap(a=>a.seqs.map(s=>({...s, act:a.act})));

/* ================= 상태 ================= */
const state = {
  title:"", logline:"", question:"", cast:"", runtime:60,
  seqs: FLAT.map(s=>({n:s.n, title:"", content:"", interview:"", broll:"", archive:"", min:null, done:false, shots:[]}))
};

/* ================= 자동 저장 ================= */
const SAVE_KEY = "docu-structure-studio-v1";
let saveTimer = null;
function autosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
      document.getElementById("saveStamp").textContent = `자동 저장됨 ${hh}:${mm}`;
    }catch(e){ /* 저장 불가 환경에서는 무시 */ }
  }, 400);
}
function restoreSaved(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state, {title:d.title||"", logline:d.logline||"", question:d.question||"", cast:d.cast||"", runtime:d.runtime||60});
    if(Array.isArray(d.seqs)) d.seqs.forEach((s,i)=>{
      if(state.seqs[i]){ Object.assign(state.seqs[i], s); if(!Array.isArray(state.seqs[i].shots)) state.seqs[i].shots = []; }
    });
  }catch(e){ /* 손상된 데이터는 무시 */ }
}

/* ================= 렌더링 ================= */
function recMin(total){ return total/8; }
function fmt(m){ return Math.round(m*10)/10; }

function buildActs(){
  const root = document.getElementById("acts");
  root.innerHTML = "";
  STRUCTURE.forEach(a=>{
    const actEl = document.createElement("div");
    actEl.className = "act"; actEl.dataset.act = a.act;
    const pct = a.act===2 ? "약 50%" : "약 25%";
    actEl.innerHTML = `<div class="act-head"><h3>${a.actName}</h3><span class="desc">${a.actDesc}</span><span class="ratio">권장 분량 ${pct}</span></div>`;
    a.seqs.forEach(sq=>{
      const st = state.seqs[sq.n-1];
      const card = document.createElement("div");
      card.className = "seq"; card.dataset.act = a.act; card.id = "seq"+sq.n;
      card.innerHTML = `
        <div class="seq-head" onclick="toggleSeq(${sq.n},event)">
          <div class="seq-num">${sq.n}</div>
          <div class="seq-title-box">
            <div class="seq-name">${sq.n}장 · ${sq.name}</div>
            <div class="seq-sub">${sq.sub}</div>
          </div>
          <div class="seq-meta">
            <span class="seq-min"><b id="min${sq.n}">–</b> 분</span>
            <div class="check" id="chk${sq.n}" onclick="toggleDone(${sq.n},event)">✓</div>
            <span class="chev">▼</span>
          </div>
        </div>
        <div class="seq-body">
          <div class="guide">
            <div class="g-label">GUIDE QUESTIONS</div>
            <ul>${sq.guide.map(g=>`<li>${g}</li>`).join("")}</ul>
          </div>
          <div class="seq-grid">
            <div>
              <div class="field">
                <label>이 장의 소제목</label>
                <input type="text" data-k="title" data-n="${sq.n}" placeholder="예: 마지막 물질을 앞둔 아침" value="">
              </div>
              <div class="field">
                <label>내용 / 시놉시스</label>
                <textarea data-k="content" data-n="${sq.n}" style="min-height:110px" placeholder="이 장에서 벌어지는 일, 보여줄 장면, 감정의 흐름을 적어보세요"></textarea>
              </div>
              <div class="runtime-row">
                <label>러닝타임</label>
                <input type="number" min="0" step="0.5" data-k="min" data-n="${sq.n}">
                <span>분</span>
                <span class="rec" id="rec${sq.n}"></span>
              </div>
            </div>
            <div class="src-box">
              <h4>📼 소스 플랜</h4>
              <div class="field">
                <label>🎤 인터뷰</label>
                <textarea data-k="interview" data-n="${sq.n}" placeholder="인터뷰이, 핵심 질문"></textarea>
              </div>
              <div class="field">
                <label>🎬 현장 · B-roll</label>
                <textarea data-k="broll" data-n="${sq.n}" placeholder="촬영할 장면, 장소"></textarea>
              </div>
              <div class="field">
                <label>🗄️ 아카이브 · 자료</label>
                <textarea data-k="archive" data-n="${sq.n}" placeholder="사진, 뉴스, 기록물 등"></textarea>
              </div>
            </div>
          </div>
          <div class="conti">
            <div class="conti-top">
              <h4>🎥 촬영 콘티 <b id="shotCnt${sq.n}"></b></h4>
              <button class="btn small" onclick="addShot(${sq.n})">＋ 컷 추가</button>
            </div>
            <div class="shot-cols">
              <div>컷</div><div>샷 크기</div><div>앵글 · 무빙</div><div>화면 내용</div><div>오디오</div><div>길이(초)</div><div></div>
            </div>
            <div id="shots${sq.n}"></div>
          </div>
        </div>`;
      actEl.appendChild(card);
    });
    root.appendChild(actEl);
  });
}

function buildTimeline(){
  const bar = document.getElementById("tlBar");
  const total = state.runtime || 60;
  bar.innerHTML = "";
  let sum = 0;
  FLAT.forEach(sq=>{
    const st = state.seqs[sq.n-1];
    const m = (st.min != null) ? st.min : recMin(total);
    sum += m;
    const seg = document.createElement("div");
    seg.className = "tl-seg";
    const colors = {1:"var(--act1)",2:"var(--act2)",3:"var(--act3)"};
    seg.style.background = colors[sq.act];
    seg.style.flex = Math.max(m, 0.1);
    seg.innerHTML = `<span>${sq.n}장 ${fmt(m)}′</span>`;
    seg.title = `${sq.n}장 · ${sq.name} — ${fmt(m)}분`;
    seg.onclick = ()=>{ openSeq(sq.n); document.getElementById("seq"+sq.n).scrollIntoView({behavior:"smooth", block:"start"}); };
    bar.appendChild(seg);
  });
  const sumEl = document.getElementById("tlSum");
  const diff = Math.round((sum-total)*10)/10;
  sum = Math.round(sum*10)/10;
  sumEl.textContent = `합계 ${sum}분 / 목표 ${total}분` + (diff===0 ? " ✓" : (diff>0? ` (+${diff}분 초과)` : ` (${diff}분 여유)`));
  sumEl.className = "sum " + (diff===0 ? "exact" : (diff>0 ? "over" : ""));
  // act labels widths
  const acts = document.getElementById("tlActs");
  const actSums = [0,0,0];
  FLAT.forEach(sq=>{ actSums[sq.act-1] += ((state.seqs[sq.n-1].min != null) ? state.seqs[sq.n-1].min : recMin(total)); });
  acts.innerHTML = actSums.map((s,i)=>`<div style="flex:${Math.max(s,0.1)}">${i+1}막 · ${Math.round(s*10)/10}분</div>`).join("");
}

function refreshMins(){
  const total = state.runtime || 60;
  FLAT.forEach(sq=>{
    const st = state.seqs[sq.n-1];
    const m = (st.min != null) ? st.min : recMin(total);
    document.getElementById("min"+sq.n).textContent = fmt(m);
    document.getElementById("rec"+sq.n).textContent = `권장 약 ${fmt(recMin(total))}분 (전체의 12.5%)`;
    const inp = document.querySelector(`input[data-k=min][data-n="${sq.n}"]`);
    if(document.activeElement !== inp) inp.value = fmt(m);
  });
}

function refreshProgress(){
  const done = state.seqs.filter(s=>s.done).length;
  document.getElementById("pbarFill").style.width = (done/8*100)+"%";
  document.getElementById("ppct").textContent = Math.round(done/8*100)+"% · "+done+"/8장";
  state.seqs.forEach(s=>{
    document.getElementById("chk"+s.n).classList.toggle("on", s.done);
    document.getElementById("seq"+s.n).classList.toggle("done", s.done);
  });
}

/* ================= 촬영 콘티 ================= */
const SHOT_SIZES = ["", "익스트림 와이드(EWS)", "와이드(WS)", "풀샷(FS)", "미디엄(MS)", "바스트(BS)", "클로즈업(CU)", "익스트림 클로즈업(ECU)", "인서트", "투샷", "드론/항공"];
const SHOT_MOVES = ["", "픽스", "팬", "틸트", "달리/트래킹", "핸드헬드", "짐벌", "줌 인", "줌 아웃", "드론 무빙", "타임랩스", "슬로모션"];

function newShot(){ return {size:"", move:"", desc:"", audio:"", dur:"", }; }

function renderShots(n){
  const st = state.seqs[n-1];
  if(!Array.isArray(st.shots)) st.shots = [];
  const box = document.getElementById("shots"+n);
  const cnt = document.getElementById("shotCnt"+n);
  cnt.textContent = st.shots.length ? `${st.shots.length}컷` : "";
  if(!st.shots.length){
    box.innerHTML = `<div class="conti-empty">아직 컷이 없어요. ＋ 컷 추가를 눌러 콘티를 짜보세요.</div>`;
    return;
  }
  box.innerHTML = st.shots.map((sh,i)=>`
    <div class="shot-row">
      <div class="cut-no">${i+1}</div>
      <select data-sn="${n}" data-si="${i}" data-sk="size">
        ${SHOT_SIZES.map(o=>`<option value="${o}" ${sh.size===o?"selected":""}>${o||"— 선택 —"}</option>`).join("")}
      </select>
      <select data-sn="${n}" data-si="${i}" data-sk="move">
        ${SHOT_MOVES.map(o=>`<option value="${o}" ${sh.move===o?"selected":""}>${o||"— 선택 —"}</option>`).join("")}
      </select>
      <textarea data-sn="${n}" data-si="${i}" data-sk="desc" placeholder="무엇을 어떻게 찍을 것인가">${sh.desc||""}</textarea>
      <input type="text" data-sn="${n}" data-si="${i}" data-sk="audio" placeholder="현장음/내레이션/음악" value="${(sh.audio||"").replace(/"/g,"&quot;")}">
      <input type="number" min="0" data-sn="${n}" data-si="${i}" data-sk="dur" placeholder="초" value="${sh.dur||""}">
      <div class="shot-btns">
        <button class="icon-btn" title="위로" onclick="moveShot(${n},${i},-1)">▲</button>
        <button class="icon-btn" title="아래로" onclick="moveShot(${n},${i},1)">▼</button>
        <button class="icon-btn del" title="삭제" onclick="delShot(${n},${i})">✕</button>
      </div>
    </div>`).join("");
}
function addShot(n){
  state.seqs[n-1].shots.push(newShot());
  renderShots(n);
  const box = document.getElementById("shots"+n);
  const last = box.querySelector(".shot-row:last-child textarea");
  if(last) last.focus();
  autosave();
}
function delShot(n,i){ state.seqs[n-1].shots.splice(i,1); renderShots(n); autosave(); }
function moveShot(n,i,dir){
  const arr = state.seqs[n-1].shots;
  const j = i+dir;
  if(j<0 || j>=arr.length) return;
  [arr[i],arr[j]] = [arr[j],arr[i]];
  renderShots(n);
  autosave();
}

/* ================= 인터랙션 ================= */
function toggleSeq(n, ev){
  if(ev && (ev.target.closest(".check"))) return;
  document.getElementById("seq"+n).classList.toggle("open");
}
function openSeq(n){ document.getElementById("seq"+n).classList.add("open"); }
function toggleDone(n, ev){
  ev.stopPropagation();
  state.seqs[n-1].done = !state.seqs[n-1].done;
  refreshProgress();
  autosave();
}

document.addEventListener("input", e=>{
  const el = e.target;
  if(el.id==="pTitle") state.title = el.value;
  else if(el.id==="pLogline") state.logline = el.value;
  else if(el.id==="pQuestion") state.question = el.value;
  else if(el.id==="pCast") state.cast = el.value;
  else if(el.id==="pRuntime"){ state.runtime = parseFloat(el.value)||60; refreshMins(); buildTimeline(); }
  else if(el.dataset.sk){
    const sh = state.seqs[el.dataset.sn-1].shots[+el.dataset.si];
    if(sh) sh[el.dataset.sk] = el.value;
  }
  else if(el.dataset.n){
    const st = state.seqs[el.dataset.n-1];
    if(el.dataset.k==="min"){
      st.min = el.value==="" ? null : parseFloat(el.value);
      document.getElementById("min"+el.dataset.n).textContent = fmt((st.min != null) ? st.min : recMin(state.runtime));
      buildTimeline();
    } else {
      st[el.dataset.k] = el.value;
    }
  }
  autosave();
});

/* ================= 저장 / 불러오기 / 내보내기 ================= */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("btnSave").onclick = ()=>{
  const name = (state.title||"다큐기획") + "_3막8장.json";
  download(name, JSON.stringify(state, null, 2), "application/json");
  toast("💾 JSON 파일로 저장했어요");
};
document.getElementById("fileInput").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      Object.assign(state, {title:d.title||"", logline:d.logline||"", question:d.question||"", cast:d.cast||"", runtime:d.runtime||60});
      if(Array.isArray(d.seqs)) d.seqs.forEach((s,i)=>{
        if(state.seqs[i]){ Object.assign(state.seqs[i], s); if(!Array.isArray(state.seqs[i].shots)) state.seqs[i].shots = []; }
      });
      hydrate();
      autosave();
      toast("📂 불러오기 완료");
    }catch(err){ toast("⚠️ 파일을 읽을 수 없어요"); }
  };
  r.readAsText(f);
  e.target.value = "";
};
document.getElementById("btnExport").onclick = ()=>{
  const t = state.title || "제목 미정";
  const total = state.runtime||60;
  let md = `# ${t}\n\n> 3막 8장 다큐멘터리 구성안\n\n`;
  md += `- **로그라인**: ${state.logline||"-"}\n- **중심 질문 / 메시지**: ${state.question||"-"}\n- **주요 인물/소재**: ${state.cast||"-"}\n- **총 러닝타임**: ${total}분\n\n---\n\n`;
  STRUCTURE.forEach(a=>{
    md += `## ${a.actName} — ${a.actDesc}\n\n`;
    a.seqs.forEach(sq=>{
      const st = state.seqs[sq.n-1];
      const m = fmt((st.min != null) ? st.min : recMin(total));
      md += `### ${sq.n}장 · ${sq.name}${st.title? ` — ${st.title}`:""} ${st.done?"✅":""}\n`;
      md += `*${sq.sub}* · **${m}분**\n\n`;
      md += `${st.content || "_내용 미작성_"}\n\n`;
      const src = [];
      if(st.interview) src.push(`- 🎤 **인터뷰**: ${st.interview.replace(/\n/g," / ")}`);
      if(st.broll) src.push(`- 🎬 **현장·B-roll**: ${st.broll.replace(/\n/g," / ")}`);
      if(st.archive) src.push(`- 🗄️ **아카이브**: ${st.archive.replace(/\n/g," / ")}`);
      if(src.length) md += `**소스 플랜**\n\n${src.join("\n")}\n\n`;
      if(Array.isArray(st.shots) && st.shots.length){
        md += `**🎥 촬영 콘티**\n\n`;
        md += `| 컷 | 샷 크기 | 앵글·무빙 | 화면 내용 | 오디오 | 길이 |\n|---|---|---|---|---|---|\n`;
        st.shots.forEach((sh,i)=>{
          const c = v => (v||"-").toString().replace(/\|/g,"／").replace(/\n/g," ");
          md += `| ${i+1} | ${c(sh.size)} | ${c(sh.move)} | ${c(sh.desc)} | ${c(sh.audio)} | ${sh.dur? sh.dur+"초":"-"} |\n`;
        });
        const totSec = st.shots.reduce((a,sh)=>a+(parseFloat(sh.dur)||0),0);
        if(totSec) md += `\n_콘티 합계 약 ${Math.round(totSec/6)/10}분 (${totSec}초)_\n`;
        md += `\n`;
      }
    });
  });
  download(t+"_3막8장_기획안.md", md, "text/markdown");
  toast("📄 기획안(.md)을 내보냈어요");
};

/* ================= 하이드레이션 ================= */
function hydrate(){
  document.getElementById("pTitle").value = state.title;
  document.getElementById("pLogline").value = state.logline;
  document.getElementById("pQuestion").value = state.question;
  document.getElementById("pCast").value = state.cast;
  document.getElementById("pRuntime").value = state.runtime;
  buildActs();
  state.seqs.forEach(s=>{
    ["title","content","interview","broll","archive"].forEach(k=>{
      const el = document.querySelector(`[data-k=${k}][data-n="${s.n}"]`);
      if(el) el.value = s[k]||"";
    });
    renderShots(s.n);
  });
  refreshMins();
  buildTimeline();
  refreshProgress();
  openSeq(1);
}
restoreSaved();
hydrate();
</script>
</body>
</html>
